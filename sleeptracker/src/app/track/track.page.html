<ion-header>
  <ion-toolbar>
    <ion-title>Track Sleep</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-content class="ion-padding ion-text-center">
    <h1>{{time}}</h1>
    <ion-label class="ion-text-wrap ion-text-start"><ion-icon name="{{orderIcons[timeSet]}}" style="font-size: 48px;"></ion-icon></ion-label>
    <p><u>{{day}}</u></p>
    <ion-label><i>{{timeMsgs[timeSet]}}</i></ion-label>
    
    
    <ion-item class="ion-text-center" style="padding-top: 3rem;">
      <ion-label>
       <ion-button (click)="openModalLog()">Create Overnight Log</ion-button>
      </ion-label>
    </ion-item>
    <ion-item class="ion-text-center">
      <ion-label>
       <ion-button (click)="openFatigueLog()">Create Sleepiness Log</ion-button>
      </ion-label>
    </ion-item>
    <ion-item class="ion-text-center">
      <ion-label>
      <ion-button (click)="getDatabase()">Debug Storage</ion-button>
      </ion-label>
    </ion-item>
    <ion-item class="ion-text-center">
      <ion-label>
      <ion-button (click)="deleteDatabase()">Delete ALL Storage</ion-button>
      </ion-label>
    </ion-item>
   

  </ion-content>
</ion-content>
