<ion-header>
  <ion-toolbar>
    <ion-title>Track Sleep</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-content class="ion-padding ion-text-center">
    <h1>{{time}}</h1>
    <p><u>{{day}}</u></p>
    <ion-label><i>{{timeMsg}}</i></ion-label>
    
    <ion-item><ion-button (click)="openModalLog()">Create Overnight Log</ion-button></ion-item>
    <ion-item><ion-button (click)="openFatigueLog()">Create Sleepiness Log</ion-button></ion-item>
    <ion-item><ion-button (click)="getDatabase()">Debug Storage</ion-button></ion-item>
    <ion-item><ion-button (click)="deleteDatabase()">Delete ALL Storage</ion-button></ion-item>
  </ion-content>
</ion-content>
