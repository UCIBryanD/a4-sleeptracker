<ion-header>
  <ion-toolbar>
    <ion-title class="ion-text-center">Log for {{logCreation.toLocaleDateString('en-US', {
      weekday: 'short',
      month: 'short',
      day: 'numeric'
    })}}</ion-title>
    <ion-buttons slot="start">
      <ion-button (click)="close()">
        Cancel
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="save()">
        Save Log
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-label>Rate your sleepiness <ion-icon name="bed-outline"></ion-icon> </ion-label>
  <ion-list>
    <ion-radio-group [(ngModel)]="rating">
      @for (data of StanfordSleepinessData.ScaleValues; track data; let i = $index) {
        @if (i != 0) {
          <ion-item>
            <ion-radio [value]="i" labelPlacement="stacked" alignment="start">{{i}}. </ion-radio>
            <ion-label class="ion-text-start">{{StanfordSleepinessData.ScaleValues[i]}}</ion-label>
          </ion-item>
        }
      }
    </ion-radio-group>
  </ion-list>
  <ion-item>
    <ion-textarea placeholder="Enter log description" [autoGrow]="true" [(ngModel)]="logText">
    </ion-textarea>
  </ion-item>
    
  
  

  
</ion-content>
