<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Sleep Log History</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="createLog()">
        Create Log
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    @for (overnightData of SleepService.AllOvernightData; track overnightData) {
      <ion-item>
        <ion-label>
          
          <ion-label>
            <h1><b><u>{{overnightData.dateString()}}</u></b></h1>
          </ion-label>
          
          <ion-label>
            <h2>You slept for: {{overnightData.summaryString()}}</h2>
          </ion-label>
          @if (overnightData.getLogText() != "") {
            <ion-label>
              <h6>Notes: "{{overnightData.getLogText()}}"</h6>
            </ion-label>
          }
        </ion-label>
        <ion-button color="primary" (click)="editEntry(overnightData)">
         <ion-icon name="create-outline"></ion-icon>
        </ion-button>
        <ion-button color="danger" (click)="deleteEntry(overnightData)">
         <ion-icon name="trash"></ion-icon>
        </ion-button>
      </ion-item>
      
    } 
</ion-content>
