<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Sleep Log History</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    @for (overnightData of SleepService.AllOvernightData; track overnightData) {
      <ion-item>
        <ion-label>
          {{overnightData.getSleepStart()}}
        </ion-label>
        <ion-label>
          {{overnightData.getSleepEnd()}}
        </ion-label>
      </ion-item>
    } 
</ion-content>
