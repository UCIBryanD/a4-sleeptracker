<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Sleep Log History</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="createLog()">
        Create Log
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    @for (overnightData of SleepService.AllOvernightData; track overnightData) {
      <ion-item>
        <ion-label>
          <ion-label>
            {{overnightData.getSleepStart()}}
          </ion-label>
          <ion-label>
            {{overnightData.getSleepEnd()}}
          </ion-label>
        </ion-label>
        <ion-button color="primary" (click)="editEntry(overnightData)">
         <ion-icon name="create-outline"></ion-icon>
        </ion-button>
        <ion-button color="danger" (click)="deleteEntry(overnightData)">
         <ion-icon name="trash"></ion-icon>
        </ion-button>
      </ion-item>
      
    } 
</ion-content>
