<ion-header>
  <ion-toolbar>
    <ion-title class="ion-text-center">Log for {{logCreation.toLocaleDateString('en-US', {
      weekday: 'short',
      month: 'short',
      day: 'numeric'
    })}}</ion-title>
    <ion-buttons slot="start">
      <ion-button (click)="close()">
        Cancel
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button (click)="saveHistoryData()">
        Save Log
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label>
      <ion-icon name="moon"></ion-icon>
        &nbsp;Went to sleep at:
    </ion-label>
    <ion-datetime-button datetime="datetime-sleep"></ion-datetime-button>
  </ion-item>

  <ion-modal [keepContentsMounted]="true">
    <ng-template>
      <ion-datetime id="datetime-sleep" [(ngModel)]="timeStartISO"></ion-datetime>
    </ng-template>
  </ion-modal>

  <ion-item>
    <ion-label>
      <ion-icon name="partly-sunny"></ion-icon>
         &nbsp;Woke up at:
    </ion-label>
    <ion-datetime-button datetime="datetime-wake"></ion-datetime-button>
  </ion-item>

  <ion-modal [keepContentsMounted]="true">
    <ng-template>
      <ion-datetime id="datetime-wake" [(ngModel)]="timeEndISO"></ion-datetime>
    </ng-template>
  </ion-modal>

  <ion-item>
    <ion-textarea placeholder="Enter log description" [autoGrow]="true" [(ngModel)]="logText">
    </ion-textarea>
  </ion-item>
  @if (exists) {
    <p>Log ID: {{id}}</p>
  }
  
</ion-content>
