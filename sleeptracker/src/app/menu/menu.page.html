<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Fatigue History</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="createLog()">
        Log Fatigue
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    @for (fatigueData of SleepService.AllSleepinessData; track fatigueData) {
      <ion-item>
        <ion-label>
          <ion-label>
            <h1><b><u>{{fatigueData.dateString()}}</u></b></h1>
          </ion-label>
          <ion-label>
            {{fatigueData.summaryString()}}
          </ion-label>
          @if (fatigueData.getLogText() != "") {
            <ion-label>
              <h6>Notes: "{{fatigueData.getLogText()}}"</h6>
            </ion-label>
          }
        </ion-label>
        <ion-button color="primary" (click)="editLog(fatigueData)">
         <ion-icon name="create-outline"></ion-icon>
        </ion-button>
        <ion-button color="danger" (click)="deleteEntry(fatigueData)">
         <ion-icon name="trash"></ion-icon>
        </ion-button>
      </ion-item>
    } 
</ion-content>
